name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/examples

          cp \
            index.html \
            404.html \
            docs.html \
            setup.html \
            security.html \
            compare.html \
            shopify-buy-button-alternative.html \
            snipcart-alternative.html \
            gumroad-alternative.html \
            stripe-payment-links-alternative.html \
            sample.html \
            site.css \
            site.js \
            tinycart.js \
            og-image.png \
            product-tee.svg \
            product-mug.svg \
            product-stickers.svg \
            favicon-32.png \
            apple-touch-icon.png \
            robots.txt \
            sitemap.xml \
            README.md \
            SETUP.md \
            SECURITY.md \
            CHANGELOG.md \
            TESTPLAN.md \
            POLISH_AND_ROADMAP.md \
            _site/

          cp \
            examples/plain-html.html \
            examples/astro-eleventy.md \
            examples/react-wrapper.jsx \
            _site/examples/

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
