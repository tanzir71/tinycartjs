<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyCart Sample Products</title>
  <meta name="description" content="Sample TinyCart product buttons wired to the local cart widget.">
  <meta property="og:title" content="TinyCart Sample Products">
  <meta property="og:description" content="Sample TinyCart product buttons wired to the local cart widget.">
  <meta property="og:image" content="https://tanzir71.github.io/tinycartjs/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    body { margin: 0; padding: 32px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111; }
    main { width: min(720px, 100%); margin: 0 auto; }
    h1 { font-size: 40px; line-height: 1; letter-spacing: 0; }
    .products { display: grid; gap: 14px; margin-top: 24px; }
    button { min-height: 48px; border: 1px solid #111; border-radius: 999px; background: #111; color: #fff; padding: 0 18px; font: 800 15px/1 system-ui; cursor: pointer; }
    button:hover { background: #1A73E8; }
  </style>
</head>
<body>
  <main>
    <h1>Sample products</h1>
    <div class="products">
      <button data-tc-id="tee-001" data-tc-name="TinyCart Tee" data-tc-price="24.00" data-tc-options='{"size":"M","color":"Black"}'>Add TinyCart Tee - $24</button>
      <button data-tc-id="mug-001" data-tc-name="Checkout Mug" data-tc-price="18.00" data-tc-options='{"finish":"Matte"}'>Add Checkout Mug - $18</button>
      <button data-tc-id="sticker-001" data-tc-name="Script Tag Sticker Pack" data-tc-price="7.00" data-tc-qty="2" data-tc-stock="250">Add Sticker Pack - $7</button>
    </div>
  </main>

  <script src="tinycart.js" data-tc-config='{"cartKey":"demo-store","currency":"USD","apiCheckout":"/checkout.php","apiCoupon":"/coupon.php","catalogUrl":"/catalog.php","analyticsUrl":"/collect.php","accent":"#1A73E8","allowedOptionKeys":["size","color","finish"],"coupons":{"SAVE10":{"type":"percent","value":10}}}'></script>
</body>
</html>
